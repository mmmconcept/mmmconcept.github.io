<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | MMM Concept</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0C1426">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 32px 16px; text-align: center; }
    .nf img { width: 96px; height: 96px; }
    .nf h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.2rem); }
    .nf p { margin: 0; color: var(--muted); max-width: 32rem; }
    .nf .code { font-family: var(--head); font-weight: 800; color: var(--mint); letter-spacing: .18em; font-size: .85rem; }
  </style>
</head>
<body>
  <main class="nf">
    <img src="/images/emblem.webp" width="96" height="96" alt="MMM Concept">
    <span class="code">404</span>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved. Our games and watch faces are on the home page.</p>
    <p><a class="btn btn-glow" href="/">Back to the home page</a></p>
  </main>
</body>
</html>
